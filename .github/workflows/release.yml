name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # a version that cannot be published is worth hearing about before the checks are spent on it,
  # which is what this being a job of its own rather than a step of the publish buys
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the node the runner already carries is enough to read a manifest and ask the registry
      - run: node apps/sacephor-deepclaw/scripts/check-version.mjs

  check:
    needs: version
    uses: ./.github/workflows/code-check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    # npm is told who is publishing by the token github mints for this job rather than by a secret,
    # which is only ever minted where it is asked for
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # publishing over oidc is what npm 11.5.1 brought, and a runner older than that would fall
      # back to looking for a token it is not given
      - run: npm install -g npm@latest
      - run: pnpm release:build
